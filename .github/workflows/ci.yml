name: Preflight CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  TZ: Asia/Jerusalem

jobs:
  preflight:
    name: Typecheck, Tests & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate route tree
        run: pnpm generate-routes

      - name: TypeScript typecheck
        run: pnpm tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Validate production Docker Compose config
        env:
          VITE_POCKETBASE_URL: https://pb.example.com
          PB_HOOK_SECRET: ci_test_secret
          PB_SUPERUSER_EMAIL: ci@example.com
          PB_SUPERUSER_PASSWORD: ci_password_123
        run: docker compose -f docker-compose.prod.yml config > /dev/null

      # Non-blocking for now: pre-existing lint backlog
      - name: Lint
        run: pnpm lint
        continue-on-error: true

  integration:
    name: PocketBase Integration Tests
    runs-on: ubuntu-latest
    env:
      PB_VERSION: 0.39.10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download PocketBase
        run: |
          wget -q "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip" -O /tmp/pb.zip
          unzip -q /tmp/pb.zip -d /tmp/pb
          chmod +x /tmp/pb/pocketbase
          echo "PB_BIN=/tmp/pb/pocketbase" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

  deploy:
    name: Trigger Dokploy Release
    needs: [preflight, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Webhook
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DOKPLOY_WEBHOOK" ]; then
            echo "→ Preflight checks passed! Triggering Dokploy release deployment..."
            curl -X POST -f -s -S "$DOKPLOY_WEBHOOK"
            echo "✅ Dokploy deploy webhook successfully triggered."
          else
            echo "ℹ️  DOKPLOY_DEPLOY_WEBHOOK_URL secret not set. Skipping webhook trigger (Dokploy handles Git polling/webhook directly if configured)."
          fi
