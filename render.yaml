services:
  - name: inkmind-crm-web
    type: web
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    plan: starter
    # MUST stay a single instance: conversation/booking serialization uses in-process
    # locks (src/lib/async-lock.ts) and the bot-turn debounce is in-memory. Scaling
    # horizontally without moving those to a shared store (DB advisory lock / Redis)
    # allows double-booked slots and duplicate bot replies.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Appointment date math is process-local-timezone throughout (src/lib/timezone.ts);
      # without this, Render's UTC containers shift every booking by 2-3 hours. The boot
      # assertion self-heals if this is missing, but be explicit. The PocketBase service
      # doesn't need it — its only cron does relative-time math (48h ago), TZ-independent.
      - key: TZ
        value: Asia/Jerusalem
      - key: POCKETBASE_URL
        fromService:
          name: inkmind-crm-pocketbase
          type: web
          property: hostport

  - name: inkmind-crm-pocketbase
    type: web
    runtime: docker
    dockerfilePath: ./pocketbase/Dockerfile
    dockerContext: ./pocketbase
    plan: starter
    disk:
      name: pocketbase-data
      mountPath: /pb/pb_data
      sizeGB: 1
