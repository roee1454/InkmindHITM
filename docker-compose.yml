services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The browser's own PocketBase URL, baked into the client bundle at build time — must
        # be the real public URL (e.g. https://pb.yourdomain.com), never the Docker-internal
        # service name. Set VITE_POCKETBASE_URL in the root .env before `docker compose build`.
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:?VITE_POCKETBASE_URL must be set in .env to the public PocketBase URL before building}
    image: inkmind-crm-web:${WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever POCKETBASE_URL/PB_URL is in .env — inside compose's network,
      # PocketBase is reachable by service name, not 127.0.0.1.
      POCKETBASE_URL: http://pocketbase:8090
      PB_URL: http://pocketbase:8090
      APP_INTERNAL_URL: http://web:3101
      PORT: "3101"
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: inkmind-crm-pocketbase:${WEB_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Must also be set here for the appointments hook (pocketbase/pb_hooks/appointments.pb.js)
      # to reach `web` and authenticate — PocketBase's Go binary does not read the app's .env.
      PB_HOOK_SECRET: ${PB_HOOK_SECRET:?PB_HOOK_SECRET must be set in the shell environment running docker compose}
      APP_INTERNAL_URL: http://web:3101
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL must be set in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD must be set in .env}
    volumes:
      - pb_data:/pb/pb_data
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pb_data: