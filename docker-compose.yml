# ==============================================================================
# Inkmind CRM - Local Development Environment (Docker Compose)
# ==============================================================================
# Usage:
#   docker compose up              # Starts services with live bind mounts
#   docker compose watch           # Starts services with Docker Compose Watch mode
#   docker compose up --watch      # Starts and automatically attaches file watcher
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-http://localhost:8090}
    image: inkmind-crm-web:dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      POCKETBASE_URL: http://pocketbase:8090
      PB_URL: http://pocketbase:8090
      APP_INTERNAL_URL: http://web:3101
      REDIS_URL: redis://redis:6379
      PORT: "3101"
      # Keeps TanStack Router generator tmp files on the same mount point as src/routeTree.gen.ts (prevents EXDEV error)
      TSR_TMP_DIR: /app/src/.tmp
    ports:
      - "127.0.0.1:3101:3101"
    volumes:
      # Live bind mounts for instant HMR / dev reload
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsr.config.json:/app/tsr.config.json
      # Prevent host node_modules from overwriting container node_modules
      - /app/node_modules
    # Docker Compose Watch configuration (docker compose watch / up --watch)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: sync
          path: ./vite.config.ts
          target: /app/vite.config.ts
        - action: sync
          path: ./tsr.config.json
          target: /app/tsr.config.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
    depends_on:
      pocketbase:
        condition: service_healthy
      redis:
        condition: service_healthy
      studio-sync:
        condition: service_completed_successfully

  studio-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync
    image: inkmind-crm-studio-sync:dev
    restart: "no"
    env_file:
      - .env
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      PB_URL: http://pocketbase:8090
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@inkmind.local}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-admin123456}
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - /app/node_modules
    depends_on:
      pocketbase:
        condition: service_healthy

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: inkmind-crm-pocketbase:dev
    restart: unless-stopped
    environment:
      PB_HOOK_SECRET: ${PB_HOOK_SECRET:-dev_hook_secret_insecure}
      APP_INTERNAL_URL: http://web:3101
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@inkmind.local}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-admin123456}
    volumes:
      - pb_data:/pb/pb_data
      # Mount hooks and migrations in dev so changes take effect without rebuilding image
      - ./pocketbase/pb_migrations:/pb/pb_migrations
      - ./pocketbase/pb_hooks:/pb/pb_hooks
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  pb_data:
  redis_data: