<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>אין חיבור — Inkmind CRM</title>
    <!-- Inline styles only: this page must render when the app bundle is unreachable. -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        box-shadow: 0 10px 30px rgb(15 23 42 / 0.06);
      }
      .mark {
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        background: #4f46e5;
        color: #fff;
        font-weight: 900;
        font-size: 1.125rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 800; }
      p { margin: 0 0 1.5rem; font-size: 0.875rem; color: #64748b; line-height: 1.6; }
      button {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #4f46e5;
        color: #fff;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
        transition: transform 0.12s ease;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">IM</div>
      <h1>אין חיבור לאינטרנט</h1>
      <p>לא הצלחנו להתחבר לשרת. בדקו את החיבור ונסו שוב — הנתונים שלכם מסונכרנים ומחכים.</p>
      <button type="button" onclick="location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
