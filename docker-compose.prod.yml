# ==============================================================================
# Inkmind CRM - Production Environment (Dokploy / Docker Compose)
# ==============================================================================
# Automated CI/CD: Push to `main` triggers Dokploy to build and deploy this stack.
# Domain routing and TLS certificates are handled natively by Dokploy (Traefik).
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:?VITE_POCKETBASE_URL must be set in .env to the public PocketBase URL}
    image: inkmind-crm-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POCKETBASE_URL: http://pocketbase:8090
      PB_URL: http://pocketbase:8090
      APP_INTERNAL_URL: http://web:3101
      REDIS_URL: redis://redis:6379
      PORT: "3101"
    expose:
      - "3101"
    depends_on:
      pocketbase:
        condition: service_healthy
      redis:
        condition: service_healthy
      studio-sync:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3101/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  studio-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync
    image: inkmind-crm-studio-sync:${WEB_IMAGE_TAG:-latest}
    restart: "no"
    env_file:
      - .env
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      PB_URL: http://pocketbase:8090
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL must be set in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD must be set in .env}
    depends_on:
      pocketbase:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    image: inkmind-crm-pocketbase:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PB_HOOK_SECRET: ${PB_HOOK_SECRET:?PB_HOOK_SECRET must be set in the environment}
      APP_INTERNAL_URL: http://web:3101
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL must be set in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD must be set in .env}
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 3s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pb_data:
  redis_data:
